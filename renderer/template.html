<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<style>
  :root {
    --w: 1080px; --h: 1920px;
    --font: "Avenir Next", "SF Pro Display", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --bg: #0b0f1a; --fg: #ffffff; --muted: rgba(255,255,255,.72);
    --acc: #3ec1ff; --acc2: #ff5c7a; --blob1: #1e3a8a; --blob2: #7c3aed; --blob3: #0ea5e9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; background: var(--bg); font-family: var(--font); color: var(--fg); }
  #stage { position: relative; width: var(--w); height: var(--h); overflow: hidden; background: var(--bg); }

  /* ---- background ---- */
  .blob { position: absolute; border-radius: 50%; opacity: .9; will-change: transform; }
  .b1 { width: 1300px; height: 1300px; background: radial-gradient(circle, var(--blob1) 0%, transparent 62%); left: -450px; top: -350px; }
  .b2 { width: 1200px; height: 1200px; background: radial-gradient(circle, var(--blob2) 0%, transparent 62%); right: -500px; top: 300px; }
  .b3 { width: 1100px; height: 1100px; background: radial-gradient(circle, var(--blob3) 0%, transparent 62%); left: -100px; bottom: -450px; opacity: .7; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 100%); }
  .grain { position: absolute; inset: 0; opacity: .06; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.4) 0 1px, transparent 1px 3px); mix-blend-mode: overlay; }
  .dots { position: absolute; inset: 0; }
  .dot { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #fff; opacity: .35; }

  /* ---- chrome ---- */
  .progress { position: absolute; top: 0; left: 0; height: 10px; background: linear-gradient(90deg, var(--acc), var(--acc2)); width: 0; border-radius: 0 6px 6px 0; }
  .brand { position: absolute; top: 120px; left: 0; right: 0; text-align: center; font-size: 28px; letter-spacing: 8px; font-weight: 600; color: rgba(255,255,255,.7); text-transform: uppercase; }
  .brand::after { content: ""; display: block; width: 44px; height: 4px; background: var(--acc); margin: 16px auto 0; border-radius: 2px; }

  /* ---- scenes ---- */
  .scene { position: absolute; inset: 0; opacity: 0; }
  .content { position: absolute; left: 80px; right: 80px; top: 420px; bottom: 560px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .emoji { font-size: 200px; line-height: 1; margin-bottom: 40px; filter: drop-shadow(0 20px 40px rgba(0,0,0,.4)); }
  .title { font-size: 92px; font-weight: 800; line-height: 1.08; letter-spacing: -1px; text-shadow: 0 6px 30px rgba(0,0,0,.35); }
  .title.small { font-size: 72px; }
  .title .w { display: inline-block; }
  .subtitle { font-size: 40px; font-weight: 500; color: var(--muted); margin-top: 36px; line-height: 1.35; }
  .body { font-size: 46px; font-weight: 500; line-height: 1.4; color: rgba(255,255,255,.9); margin-top: 40px; }
  .bar { width: 120px; height: 8px; border-radius: 4px; background: var(--acc); margin: 36px auto 0; }

  .list { margin-top: 48px; width: 100%; display: flex; flex-direction: column; gap: 26px; }
  .item { display: flex; align-items: center; gap: 28px; text-align: left; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.12); border-radius: 28px; padding: 30px 38px; font-size: 42px; font-weight: 600; line-height: 1.25; }
  .item .n { flex: none; width: 76px; height: 76px; border-radius: 50%; background: var(--acc); color: #06131f; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 38px; }

  .type-stat .value { font-size: 240px; font-weight: 800; line-height: 1; letter-spacing: -6px; background: linear-gradient(135deg, #fff, var(--acc)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .type-stat .label { font-size: 50px; font-weight: 600; margin-top: 30px; color: rgba(255,255,255,.9); line-height: 1.3; }

  .type-quote .mark { font-size: 260px; line-height: .6; color: var(--acc); font-weight: 800; opacity: .9; }
  .type-quote .q { font-size: 64px; font-weight: 700; line-height: 1.3; font-style: italic; margin-top: 20px; }
  .type-quote .a { font-size: 38px; color: var(--muted); margin-top: 40px; }
  .type-quote .a::before { content: "— "; }

  .compare { width: 100%; display: flex; gap: 96px; margin-top: 40px; }
  .col { flex: 1; min-width: 0; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.12); border-radius: 32px; padding: 36px 30px; text-align: left; }
  .col h3 { font-size: 46px; font-weight: 800; margin-bottom: 26px; }
  .col.l h3 { color: var(--acc2); } .col.r h3 { color: var(--acc); }
  .col li { list-style: none; font-size: 34px; font-weight: 500; line-height: 1.3; padding: 12px 0; border-top: 1px solid rgba(255,255,255,.12); }
  .vs { position: absolute; left: 50%; top: 50%; margin: -48px 0 0 -48px; width: 96px; height: 96px; border-radius: 50%; background: #fff; color: #0b0f1a; font-weight: 800; font-size: 34px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 40px rgba(0,0,0,.4); }

  .cta { margin-top: 60px; background: #fff; color: #0b0f1a; font-weight: 800; font-size: 44px; padding: 30px 70px; border-radius: 60px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }


  /* ---- brand end card ---- */
  .brandbg { position:absolute; inset:0; background:var(--brand-bg,#070b16); }
  .brandglow { position:absolute; left:50%; top:46%; width:1400px; height:1400px; opacity:.32; transform:translate(-50%,-50%); background:radial-gradient(circle, var(--brand-acc,#f26a1b) 0%, transparent 62%); }
  .logo { position:absolute; left:50%; top:46%; width:820px; transform:translate(-50%,-50%); filter:drop-shadow(0 0 40px rgba(242,106,27,.45)); }
  .logo img { width:100%; display:block; }
  .logofb { text-align:center; font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif; }
  .logofb .n { font-size:190px; font-weight:800; letter-spacing:6px; color:#fff; line-height:1; }
  .logofb .n b { color:var(--brand-acc,#f26a1b); font-weight:800; }
  .logofb .t { margin-top:26px; font-size:40px; letter-spacing:10px; color:rgba(255,255,255,.85); font-weight:600; }
  .logofb .t b { color:var(--brand-acc,#f26a1b); font-weight:600; }
  .brandcta { position:absolute; left:50%; top:1400px; transform:translateX(-50%); background:var(--brand-acc,#f26a1b); color:#0a0e1a; font-weight:800; font-size:46px; letter-spacing:4px; padding:30px 76px; border-radius:60px; box-shadow:0 20px 60px rgba(242,106,27,.35); text-transform:uppercase; white-space:nowrap; }
  .brandsub { position:absolute; left:0; right:0; top:1540px; text-align:center; font-size:34px; letter-spacing:6px; color:rgba(255,255,255,.6); text-transform:uppercase; }
  .bp { position:absolute; width:6px; height:6px; border-radius:50%; background:var(--brand-acc,#f26a1b); box-shadow:0 0 10px var(--brand-acc,#f26a1b); }

  /* ---- captions ---- */
  .captions { position: absolute; left: 70px; right: 70px; bottom: 300px; text-align: center; font-size: 58px; font-weight: 800; line-height: 1.25; text-shadow: 0 4px 18px rgba(0,0,0,.6); }
  .captions .cw { display: inline-block; margin: 0 10px; padding: 4px 8px; border-radius: 16px; color: rgba(255,255,255,.55); transition: none; }
  .captions .cw.on { color: #fff; background: var(--acc); color: #06131f; transform: scale(1.08); }
  .captions .cw.done { color: #fff; }
</style>
</head>
<body>
<div id="stage">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="dots" id="dots"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="brand" id="brand"></div>
  <div id="scenes"></div>
  <div class="captions" id="captions"></div>
  <div class="progress" id="progress"></div>
</div>

<script src="people.js"></script>
<script>
// ---------- utils ----------
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const easeOut = t => 1 - Math.pow(1 - clamp(t,0,1), 3);
const easeOutBack = t => { t=clamp(t,0,1); const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const clamp2=clamp;
function seeded(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }

const THEMES = {
  midnight: { bg:'#0b0f1a', blob1:'#1e3a8a', blob2:'#7c3aed', blob3:'#0ea5e9', acc:'#3ec1ff', acc2:'#ff5c7a' },
  sunset:   { bg:'#1a0b12', blob1:'#9f1239', blob2:'#f97316', blob3:'#7c2d12', acc:'#ffb454', acc2:'#ff4d6d' },
  forest:   { bg:'#06120e', blob1:'#065f46', blob2:'#166534', blob3:'#0e7490', acc:'#5eead4', acc2:'#fbbf24' },
  ocean:    { bg:'#061220', blob1:'#0c4a6e', blob2:'#0369a1', blob3:'#1d4ed8', acc:'#67e8f9', acc2:'#f472b6' },
  candy:    { bg:'#160a1f', blob1:'#a21caf', blob2:'#db2777', blob3:'#6d28d9', acc:'#f9a8d4', acc2:'#facc15' },
  gold:     { bg:'#12100a', blob1:'#78350f', blob2:'#a16207', blob3:'#3f2d0c', acc:'#fde68a', acc2:'#fb7185' },
};

// ---------- state ----------
let PLAN = null;   // {brand, theme, scenes:[{type,start,end,words:[{t0,t1,text}], ...}]}
const TRANS = 0.5;

function applyTheme(name){
  const t = THEMES[name] || THEMES.midnight;
  const r = document.documentElement.style;
  r.setProperty('--bg', t.bg); r.setProperty('--blob1', t.blob1); r.setProperty('--blob2', t.blob2);
  r.setProperty('--blob3', t.blob3); r.setProperty('--acc', t.acc); r.setProperty('--acc2', t.acc2);
}

function buildDots(){
  const box = document.getElementById('dots'); box.innerHTML='';
  const rnd = seeded(42);
  for (let i=0;i<28;i++){
    const d=document.createElement('div'); d.className='dot';
    d.dataset.x = rnd()*1080; d.dataset.y = rnd()*1920; d.dataset.s = 0.4+rnd()*1.2; d.dataset.p = rnd()*6.28; d.dataset.v = 8+rnd()*20;
    d.style.transform=`scale(${d.dataset.s})`; box.appendChild(d);
  }
}

function words(str){ return String(str??'').split(/\s+/).filter(Boolean); }

function buildScene(sc, i){
  const el=document.createElement('div'); el.className='scene'; el.id='sc'+i;
  const c=document.createElement('div'); c.className='content type-'+sc.type;
  const T = (txt,cls='title')=> `<div class="${cls}">${words(txt).map((w,k)=>`<span class="w" data-k="${k}">${esc(w)}</span>`).join(' ')}</div>`;
  let html='';
  switch(sc.type){
    case 'hook':
      html += sc.emoji ? `<div class="emoji anim" data-d="0">${esc(sc.emoji)}</div>`:'';
      html += `<div class="anim" data-d="0.1">${T(sc.title)}</div>`;
      if (sc.subtitle) html += `<div class="subtitle anim" data-d="0.5">${esc(sc.subtitle)}</div>`;
      break;
    case 'text':
      html += sc.emoji ? `<div class="emoji anim" data-d="0" style="font-size:150px">${esc(sc.emoji)}</div>`:'';
      html += `<div class="anim" data-d="0.1">${T(sc.title,'title small')}</div><div class="bar anim" data-d="0.4"></div>`;
      if (sc.body) html += `<div class="body anim" data-d="0.55">${esc(sc.body)}</div>`;
      break;
    case 'list':
      html += `<div class="anim" data-d="0">${T(sc.title,'title small')}</div><div class="list">`;
      (sc.items||[]).forEach((it,k)=>{ html += `<div class="item anim" data-d="${0.35+k*0.28}"><div class="n">${k+1}</div><div>${esc(it)}</div></div>`; });
      html += `</div>`;
      break;
    case 'stat':
      html += `<div class="value anim count" data-d="0" data-v="${esc(sc.value)}">${esc(sc.value)}</div><div class="label anim" data-d="0.45">${esc(sc.label)}</div>`;
      break;
    case 'quote':
      html += `<div class="mark anim" data-d="0">“</div><div class="q anim" data-d="0.15">${esc(sc.quote)}</div>`;
      if (sc.author) html += `<div class="a anim" data-d="0.5">${esc(sc.author)}</div>`;
      break;
    case 'compare':
      html += `<div class="anim" data-d="0">${T(sc.title,'title small')}</div><div class="compare" style="position:relative">`;
      const L=sc.left||{}, R=sc.right||{};
      html += `<div class="col l anim" data-d="0.3"><h3>${esc(L.title)}</h3><ul>${(L.items||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
      html += `<div class="col r anim" data-d="0.5"><h3>${esc(R.title)}</h3><ul>${(R.items||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
      html += `<div class="vs anim" data-d="0.7">VS</div></div>`;
      break;
    case 'brand':
      c.classList.add('brandwrap'); break;
    case 'outro':
      html += sc.emoji ? `<div class="emoji anim" data-d="0">${esc(sc.emoji)}</div>`:'';
      html += `<div class="anim" data-d="0.1">${T(sc.title)}</div>`;
      if (sc.subtitle) html += `<div class="subtitle anim" data-d="0.4">${esc(sc.subtitle)}</div>`;
      if (sc.cta) html += `<div class="cta anim" data-d="0.7">${esc(sc.cta)}</div>`;
      break;
    default:
      html += `<div class="anim" data-d="0">${T(sc.title||'')}</div>`;
  }
  c.innerHTML=html; el.appendChild(c);
  if (sc.type==='brand'){ let h=''; const i=0; PLAN=PLAN||{};
    h+=`<div class="brandbg"></div><div class="brandglow"></div><div id="bp${i}">${Array.from({length:26},(_,k)=>`<div class="bp" data-k="${k}"></div>`).join('')}</div>`;
    h+=`<div class="logo anim" data-d="0.1">${PLAN.logo?`<img src="${PLAN.logo}">`:wordmark()}</div>`;
    if (sc.cta) h+=`<div class="brandcta anim" data-d="0.9">${esc(sc.cta)}</div>`;
    if (sc.sub) h+=`<div class="brandsub anim" data-d="1.3">${esc(sc.sub)}</div>`;
    const w=document.createElement('div'); w.style.cssText='position:absolute;inset:0'; w.innerHTML=h; el.appendChild(w); c.remove(); }
  // personaj: sc.person = "wave" | {anim, x, y, scale, flip, color}
  if (sc.person && sc.person!=='none'){
    const o = typeof sc.person==='string' ? {anim:sc.person} : Object.assign({}, sc.person);
    const th = THEMES[PLAN.theme]||THEMES.midnight;
    const def = {color: th.acc2, skin:'#f2c9a7', propAccent: th.acc, prop:'#1b2233', scale: 1.1, x: 0, y: 960};
    if (['wave','point','idle'].includes(o.anim)) { def.x = 620; def.flip = (o.anim==='point'); }
    if (o.anim==='walk'||o.anim==='run') { def.x = -320; def.y = 1010; }
    const opts = Object.assign(def, o);
    const pr = People.create(opts); const host=document.createElement('div'); host.className='phost'; host.style.cssText='position:absolute;inset:0;pointer-events:none';
    host.innerHTML=pr.svg; host._person=pr; host._opts=opts; el.appendChild(host);
  }
  return el;
}

function wordmark(){ const b=(PLAN.brand_info||{}); const name=esc(b.name||'BRAND'); const tag=esc(b.tagline||'');
  const n=name.replace(/(\d+)/g,'<b>$1</b>'); const parts=tag.split(' '); const t=parts.length>1?parts.slice(0,-1).join(' ')+' <b>'+parts[parts.length-1]+'</b>':tag;
  const r=document.documentElement.style; if(b.accent){r.setProperty('--brand-acc',b.accent);} if(b.bg){r.setProperty('--brand-bg',b.bg);}
  return `<div class="logofb"><div class="n">${n}</div>${tag?`<div class="t">${t}</div>`:''}</div>`; }
window.setup = function(plan){
  PLAN = plan; applyTheme(plan.theme); buildDots();
  document.getElementById('brand').textContent = plan.brand || '';
  const box=document.getElementById('scenes'); box.innerHTML='';
  plan.scenes.forEach((sc,i)=>box.appendChild(buildScene(sc,i)));
  return plan.scenes.length;
};

function animate(el, local){
  // entrance animations: element fades/slides in at local time - delay
  el.querySelectorAll('.anim').forEach(a=>{
    const d=parseFloat(a.dataset.d||0); const p=easeOut((local-d)/0.6);
    const pb=easeOutBack((local-d)/0.7);
    a.style.opacity=p;
    if (a.classList.contains('logo')) a.style.transform=`translate(-50%,-50%) scale(${0.7+0.3*pb})`;
    else if (a.classList.contains('brandcta')) a.style.transform=`translateX(-50%) translateY(${(1-p)*50}px)`;
    else a.style.transform=`translateY(${(1-p)*60}px) scale(${0.9+0.1*pb})`;
    if (a.classList.contains('count')) {
      const v=a.dataset.v||''; const m=v.match(/^([^\d]*)(\d[\d.,]*)(.*)$/);
      if (m){ const num=parseFloat(m[2].replace(/[\s,]/g,'')); const cur=Math.round(num*easeOut((local-d)/1.4)); a.textContent=m[1]+cur.toLocaleString('en').replace(/,/g,' ')+m[3]; }
    }
  });
  if (el.querySelector('.bp')){ const local2=local;
    const rr=seeded(321); el.querySelectorAll('.bp').forEach(p=>{const k=+p.dataset.k;const a=rr()*6.283+local2*(0.12+rr()*0.2)*(k%2?1:-1);const rad=430+rr()*160+Math.sin(local2*1.5+k)*12;
      p.style.transform=`translate(${540+Math.cos(a)*rad}px,${880+Math.sin(a)*rad*0.9}px) scale(${0.5+rr()*1.2})`;p.style.opacity=clamp((local2-0.2)*1.5,0,1)*(0.4+0.6*Math.abs(Math.sin(local2*2+k)));});
  }
  // word-by-word pop for titles
  el.querySelectorAll('.title .w').forEach(w=>{
    const k=+w.dataset.k; const p=easeOutBack((local-0.1-k*0.08)/0.5);
    w.style.opacity=clamp(p*2,0,1); w.style.transform=`translateY(${(1-clamp(p,0,1))*40}px) scale(${clamp(p,0,1.05)})`;
  });
}

function captionsAt(sc, t){
  const box=document.getElementById('captions');
  if (sc.type==='brand' || sc.captions===false){ box.innerHTML=''; return; }
  const ws=sc.words||[]; if(!ws.length){ box.innerHTML=''; return; }
  // group words into chunks of <=5 by time, show current chunk
  const CH=5; let idx=-1;
  for(let i=0;i<ws.length;i++){ if(t>=ws[i].t0) idx=i; }
  if (t < ws[0].t0-0.2 || t > ws[ws.length-1].t1+0.6){ box.innerHTML=''; return; }
  const gi=Math.max(0,Math.floor(Math.max(idx,0)/CH)); const chunk=ws.slice(gi*CH,gi*CH+CH);
  box.innerHTML=chunk.map((w,i)=>{ const gidx=gi*CH+i; const cls = gidx===idx?'cw on': (gidx<idx?'cw done':'cw'); return `<span class="${cls}">${esc(w.text)}</span>`; }).join('');
}

window.seek = function(t){
  if(!PLAN) return;
  const total=PLAN.duration;
  document.getElementById('progress').style.width=(1080*clamp(t/total,0,1))+'px';
  // background motion
  const b=document.querySelectorAll('.blob');
  b[0].style.transform=`translate(${Math.sin(t*0.25)*120}px, ${Math.cos(t*0.2)*90}px)`;
  b[1].style.transform=`translate(${Math.cos(t*0.18)*140}px, ${Math.sin(t*0.23)*110}px)`;
  b[2].style.transform=`translate(${Math.sin(t*0.21+1)*100}px, ${Math.cos(t*0.17)*80}px)`;
  document.querySelectorAll('.dot').forEach(d=>{
    const y=(+d.dataset.y - t*d.dataset.v) % 1920; const yy=y<0?y+1920:y;
    const x=+d.dataset.x + Math.sin(t*0.6+ +d.dataset.p)*20;
    d.style.transform=`translate(${x}px,${yy}px) scale(${d.dataset.s})`;
  });
  // scenes
  let active=null;
  PLAN.scenes.forEach((sc,i)=>{
    const el=document.getElementById('sc'+i);
    const local=t-sc.start;
    let op=0;
    if (t>=sc.start && t<sc.end){ op=1; if(i>0 && local<TRANS) op=easeOut(local/TRANS); if(t>sc.end-TRANS && i<PLAN.scenes.length-1) op=1; }
    else if (t>=sc.end && t<sc.end+TRANS && i<PLAN.scenes.length-1){ op=1-easeOut((t-sc.end)/TRANS); }
    el.style.opacity=op;
    if (op>0){
      const inP = i>0 ? easeOut(local/TRANS) : 1;
      const out = (t>sc.end && i<PLAN.scenes.length-1) ? easeOut((t-sc.end)/TRANS) : 0;
      el.style.transform=`translateY(${(1-inP)*80 - out*80}px) scale(${1-out*0.04})`;
      animate(el, Math.max(local,0));
      const ph=el.querySelector('.phost'); if(ph){ const lo=Math.max(local,0); ph._person.apply(ph,lo); const sv=ph.querySelector('svg'); const p=easeOut((lo-0.2)/0.5); sv.style.opacity=p;
        if(ph._opts.anim==='walk'||ph._opts.anim==='run'){ sv.style.left=(ph._opts.x+lo*(ph._opts.speed||220))+'px'; } else { sv.style.transform=(ph._opts.flip?'scaleX(-1) ':'')+`translateY(${(1-p)*40}px)`; } }
    }
    if (t>=sc.start && t<sc.end) active=sc;
  });
  if (active) captionsAt(active, t); else document.getElementById('captions').innerHTML='';
};
</script>
</body>
</html>
